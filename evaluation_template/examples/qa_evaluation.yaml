# Example Configuration: Question Answering Evaluation
# This configuration evaluates QA system responses against ground truth answers

dataset:
  file_path: "./data/qa_dataset.csv"
  columns:
    prompt: "question"
    response: "model_answer"
    ground_truth: "correct_answer"
    metadata: "question_category"

experiment:
  name: "qa_system_evaluation"
  run_name_prefix: "qa_eval"
  output_directory: "./results/qa/"

judges:
  models:
    - "gpt-4o"
  api:
    openai_api_key_env: "OPENAI_API_KEY"
    openai_base_url_env: "OPENAI_API_BASE"
    temperature: 0
    timeout: 60

metrics:
  accuracy:
    enabled: true
    description: "Factual accuracy compared to ground truth"
    prompt_template: |
      You are an impartial evaluator.
      Your task is to assess how factually accurate the model's answer is compared to the correct answer.
      
      ### Materials
      
      * **Question:**
        ```
        {prompt}
        ```
      
      * **Model Answer:**
        ```
        {response}
        ```
      
      * **Correct Answer:**
        ```
        {ground_truth}
        ```
      
      ### Evaluation Guidelines
      
      Rate the factual accuracy on a scale of 1-5:
      - 1: Completely incorrect, contradicts the correct answer
      - 2: Mostly incorrect with some correct elements
      - 3: Partially correct but missing key information
      - 4: Mostly correct with minor inaccuracies
      - 5: Completely accurate, matches the correct answer
      
      ### Output Format
      
      Return only this JSON (no extra text):
      ```json
      {{
        "accuracy_score": <1-5 integer>,
        "explanation": "<concise comparison to ground truth>"
      }}
      ```
    score_key: "accuracy_score"
    threshold: 4
    scale: 5

  completeness:
    enabled: true
    description: "How completely the answer addresses the question"
    prompt_template: |
      You are an impartial evaluator.
      Your task is to assess how completely the model's answer addresses the question.
      
      ### Materials
      
      * **Question:**
        ```
        {prompt}
        ```
      
      * **Model Answer:**
        ```
        {response}
        ```
      
      * **Reference Answer:**
        ```
        {ground_truth}
        ```
      
      ### Evaluation Guidelines
      
      Rate the completeness on a scale of 1-5:
      - 1: Addresses very little or none of the question
      - 2: Addresses some aspects but misses key components
      - 3: Addresses most aspects with some gaps
      - 4: Addresses nearly all aspects thoroughly
      - 5: Comprehensively addresses all aspects of the question
      
      ### Output Format
      
      Return only this JSON (no extra text):
      ```json
      {{
        "completeness_score": <1-5 integer>,
        "explanation": "<concise explanation of what was covered or missed>"
      }}
      ```
    score_key: "completeness_score"
    threshold: 3
    scale: 5

  correctness:
    enabled: true
    description: "Binary assessment of answer correctness"
    prompt_template: |
      You are an impartial evaluator.
      Your task is to determine if the model's answer is fundamentally correct.
      
      ### Materials
      
      * **Question:**
        ```
        {prompt}
        ```
      
      * **Model Answer:**
        ```
        {response}
        ```
      
      * **Correct Answer:**
        ```
        {ground_truth}
        ```
      
      ### Evaluation Guidelines
      
      Determine if the model answer is fundamentally correct:
      - The core information must be accurate
      - Minor details may vary but main points should align
      - No major misconceptions or errors
      
      ### Output Format
      
      Return only this JSON (no extra text):
      ```json
      {{
        "correctness_score": <0 for incorrect, 1 for correct>,
        "explanation": "<brief explanation of correctness assessment>"
      }}
      ```
    score_key: "correctness_score"
    threshold: 1
    scale: 1

  clarity:
    enabled: true
    description: "How clear and understandable the answer is"
    prompt_template: |
      You are an impartial evaluator.
      Your task is to assess the clarity of the model's answer.
      
      ### Materials
      
      * **Question:**
        ```
        {prompt}
        ```
      
      * **Model Answer:**
        ```
        {response}
        ```
      
      ### Evaluation Guidelines
      
      Rate the clarity on a scale of 1-5:
      - 1: Very unclear, confusing, or hard to understand
      - 2: Somewhat unclear with confusing elements
      - 3: Generally clear with some unclear parts
      - 4: Clear and easy to understand
      - 5: Exceptionally clear and well-explained
      
      ### Output Format
      
      Return only this JSON (no extra text):
      ```json
      {{
        "clarity_score": <1-5 integer>,
        "explanation": "<concise explanation of clarity assessment>"
      }}
      ```
    score_key: "clarity_score"
    threshold: 3
    scale: 5

composite_metrics:
  qa_quality:
    description: "Overall QA system quality"
    method: "weighted_average"
    metrics:
      - "accuracy"
      - "completeness"
      - "clarity"
    weights:
      accuracy: 0.5
      completeness: 0.3
      clarity: 0.2

  pass_fail:
    description: "Whether the answer meets minimum standards"
    method: "minimum"
    metrics:
      - "correctness"
      - "accuracy"

mlflow:
  enabled: true
  tracking_uri: null
  experiment_tags:
    evaluation_type: "question_answering"
    version: "1.0"
    domain: "knowledge_base"