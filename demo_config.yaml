api_keys:
  openai_api_key: your-openai-api-key
  openai_base_url: https://api.openai.com/v1
dataset:
  ground_truth_column: ground_truth
  path: demo_dataset.json
  prompt_column: prompt
  response_column: response
  user_features_column: user_features
evaluation:
  experiment_name: demo_4_metrics_experiment
  metrics:
    accuracy:
      output_schema:
        fields:
          accuracy_score: int
          explanation: str
      prompt_template: "\nYou are an impartial evaluator.\nEvaluate the accuracy of\
        \ the response compared to the ground truth.\n\nUser Query: {prompt}\nModel\
        \ Response: {response}\nGround Truth: {ground_truth}\n\nRate accuracy from\
        \ 1-5 where:\n1 = Completely inaccurate\n2 = Mostly inaccurate  \n3 = Partially\
        \ accurate\n4 = Mostly accurate\n5 = Completely accurate\n\nReturn JSON: {{\"\
        accuracy_score\": <1-5>, \"explanation\": \"<reasoning>\"}}\n"
      threshold: 3.0
    helpfulness:
      output_schema:
        fields:
          explanation: str
          helpfulness_score: int
      prompt_template: '

        You are an impartial evaluator.

        Evaluate how helpful the response is to the user.


        User Query: {prompt}

        Model Response: {response}


        Rate helpfulness from 1-5 where:

        1 = Not helpful at all

        2 = Slightly helpful

        3 = Moderately helpful

        4 = Very helpful

        5 = Extremely helpful


        Return JSON: {{"helpfulness_score": <1-5>, "explanation": "<reasoning>"}}

        '
      threshold: 3.0
    personalization:
      output_schema:
        fields:
          explanation: str
          personalization_score: int
      prompt_template: '

        You are an impartial evaluator.

        Evaluate how well the response incorporates user personalization features.


        User Query: {prompt}

        Model Response: {response}

        User Features: {user_features}


        Rate personalization from 1-5 where:

        1 = No personalization

        2 = Minimal personalization

        3 = Moderate personalization

        4 = Good personalization

        5 = Excellent personalization


        Return JSON: {{"personalization_score": <1-5>, "explanation": "<reasoning>"}}

        '
      threshold: 3.0
    relevance:
      output_schema:
        fields:
          explanation: str
          relevance_score: int
      prompt_template: '

        You are an impartial evaluator.

        Evaluate how relevant the response is to the user query.


        User Query: {prompt}

        Model Response: {response}


        Rate relevance from 1-5 where:

        1 = Completely irrelevant

        2 = Mostly irrelevant

        3 = Partially relevant

        4 = Mostly relevant

        5 = Completely relevant


        Return JSON: {{"relevance_score": <1-5>, "explanation": "<reasoning>"}}

        '
      threshold: 3.0
  run_name: demo_run_1
models:
  judge_models:
  - gpt-4o
  response_model: GOLDEN_RESPONSE
