<!-- JavaScript to populate trial labels -->
<script>
Qualtrics.SurveyEngine.addOnload(function() {
    // Get prompt texts for labeling
    var prompts = {
        "1": "Define 'compound interest'",
        "2": "Give 3 dinner ideas with rice, eggs, spinach", 
        "3": "Fix Python bug: pritn('hi')",
        "4": "Summarize machine learning blurb",
        "5": "Recommend rainy day activity"
    };
    
    // Update slider labels with actual prompts
    for (var i = 1; i <= 5; i++) {
        var promptId = "${e://Field/trial_" + i + "_prompt_id}";
        var promptText = prompts[promptId] || "Trial " + i;
        
        // Update the label text (this depends on Qualtrics DOM structure)
        var sliderLabel = jQuery('label[for*="QR~QID' + this.questionId + '~' + i + '"]');
        if (sliderLabel.length > 0) {
            sliderLabel.html("Trial " + String.fromCharCode(64 + i) + ": " + promptText);
        }
    }
});
</script>
